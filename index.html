<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Marmot Catch</title>

<style>
body {
    margin: 0;
    background: #87CEEB;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
}

canvas {
    background: #87CEEB;
    image-rendering: pixelated;
    width: 100vw;
    height: 100vh;
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = 180;
canvas.height = 180;

// ===== GAME STATE =====
let score = 0;
let birds = [];
let gravity = 0.5;
let gameSpeed = 2;
let gameState = "home"; // "home", "playing"
// ===== MARMOT =====
const marmot = {
    y: 130,
    width: 16,
    height: 16,
    dy: 0,
    grounded: true,
    jumpPower: -8
};
marmot.x = canvas.width / 2 - marmot.width / 2;

// ===== INPUT (Mobile + Desktop) =====
function jump() {
    if (gameState === "home") {
        startGame();
        return;
    }

    if (marmot.grounded) {
        marmot.dy = marmot.jumpPower;
        marmot.grounded = false;
    }
}

function startGame() {
    score = 0;
    birds = [];
    marmot.y = 130;
    marmot.dy = 0;
    marmot.grounded = true;

    gameState = "playing";
}


document.addEventListener("touchstart", jump);
document.addEventListener("mousedown", jump);

// ===== SPAWN BIRDS =====
function spawnBird() {
    birds.push({
        x: -20,
        y: 70 + Math.random() * 50,
        size: 12,
        speed: 2 + Math.random() * 2 * (performance.now() / 20000),
        flap: 0,
        dflap: 0.5
    });
}
function randomInterval(callback, min, max) {
    function loop() {
        const delay = Math.random() * (max - min) + min;
        setTimeout(() => {
            callback();
            loop();
        }, delay);
    }
    loop();
}

function resetGame() {
    score = 0;
    birds = [];

    marmot.y = 130;
    marmot.dy = 0;
    marmot.grounded = true;
}

function goHome() {
    resetGame();
    gameState = "home";
}

randomInterval(() => {
    if (gameState === "playing") {
        spawnBird();
    }
}, 700, 2000);

// ===== UPDATE =====
function update() {
    // Gravity
    marmot.dy += gravity;
    marmot.y += marmot.dy;

    // Ground
    if (marmot.y >= 130) {
        marmot.y = 130;
        marmot.dy = 0;
        marmot.grounded = true;
    }

    // Move birds
    for (let i = birds.length - 1; i >= 0; i--) {
        birds[i].x += birds[i].speed;

        // Collision
        if (
            birds[i].x < marmot.x + marmot.width &&
            birds[i].x + birds[i].size > marmot.x &&
            birds[i].y < marmot.y + marmot.height &&
            birds[i].y + birds[i].size > marmot.y
        ) {
            birds.splice(i, 1);
            score++;
            continue;
        }

        // Remove off-screen
        if (birds[i].x > canvas.width) {
            birds.splice(i, 1);
        }
    }
}

// ===== DRAW PIXEL MARMOT =====
function drawMarmot(x, y) {
    ctx.fillStyle = "#8B5A2B"; // body
    ctx.fillRect(x-5, y+10, 10, 6);

    ctx.fillStyle = "#A0522D"; // head
    ctx.fillRect(x-4, y+7, 8, 3);
    ctx.fillStyle = "#000";
    ctx.fillRect(x-1, y+9, 2, 1)
    // eye
    ctx.fillRect(x+2, y+8, 2, 1);
    ctx.fillRect(x-4, y+8, 2, 1);

    ctx.fillStyle = "#654321"; // legs
    ctx.fillRect(x-4, y+15, 2, 1);
    ctx.fillRect(x+2, y+15, 2, 1);
    ctx.fillRect(x-5, y+12, 4, 1);
    ctx.fillRect(x, y+12, 4, 1);
}

// ===== DRAW PIXEL BIRD =====
function drawBird(x, y, flap) {
    ctx.fillStyle = "white";
    ctx.fillRect(x+2, y+4, 12, 3);
    ctx.fillStyle = "#D3D3D3"
    if (flap>=0) {
        ctx.fillRect(x+1, y+5, 8, 2);   // wing
    } else {
        ctx.fillRect(x+1, y, 8, 6)
    }
    ctx.fillStyle = "yellow"
    ctx.fillRect(x+14, y+4, 8, 2)
}

// ===== DRAW =====
function draw() {
    if (gameState === "home") {
        ctx.fillStyle = "#87CEEB";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = "black";
        ctx.font = "14px monospace";
        ctx.fillText("MARMOT CATCH", 25, 70);
        
        ctx.font = "10px monospace";
        ctx.fillText("Tap or Click to Start", 30, 100);
        
        return; // stop drawing game
    }
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Ground
    ctx.fillStyle = "#228B22";
    ctx.fillRect(0, 146, canvas.width, 34);

    drawMarmot(marmot.x, marmot.y);

    birds.forEach(bird => {
        if (bird.flap==1) {
            bird.dflap = -bird.dflap
        } else if (bird.flap==-1) {
            bird.dflap = -bird.dflap
        }
        bird.flap += bird.dflap;
        drawBird(bird.x, bird.y, bird.flap)
    });

    ctx.fillStyle = "black";
    ctx.font = "10px monospace";
    ctx.fillText("Score: " + score + "   Difficulty:" + Math.ceil(performance.now() / 20000), 10, 15);
}

// ===== GAME LOOP =====
function gameLoop() {
    if (gameState === "playing") {
        update();
    }

    draw();
    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>

</body>
</html>
